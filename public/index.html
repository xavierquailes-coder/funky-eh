<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Berri Browser</title>
<style>

  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --plum: #2c0f22; --plum-deep: #1b0916; --cherry: #e63462; --cherry-soft: #ff7a9c;
    --berry-pink: #ffb3c6; --cream: #fff6f2; --ink: #2a1420; --ink-soft: #6b4a5a;
    --glass: rgba(20, 8, 16, 0.55); --glass-light: rgba(255, 255, 255, 0.14); --glass-border: rgba(255, 255, 255, 0.16);
    --font-display: 'Baloo 2', sans-serif; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100vh; width: 100%; font-family: var(--font-body); color: var(--cream); background: radial-gradient(circle at 50% 0%, #3a1428 0%, var(--plum-deep) 65%); -webkit-font-smoothing: antialiased; }

  html, body { overflow: hidden; }
  body { cursor: default; background: var(--plum-deep); }

  .bb-app {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Tab strip ---------- */
  .bb-tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 10px 10px 0;
    background: var(--glass);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--glass-border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bb-tabstrip::-webkit-scrollbar { display: none; }

  .bb-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 200px;
    min-width: 120px;
    padding: 9px 10px 9px 14px;
    border-radius: 12px 12px 0 0;
    background: var(--glass-light);
    color: var(--berry-pink);
    font: 600 13px var(--font-body);
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    border-bottom: none;
    transition: background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease), opacity .15s var(--ease), max-width .18s var(--ease), padding .18s var(--ease), margin .18s var(--ease);
    flex-shrink: 0;
  }
  .bb-tab:hover { background: rgba(255,255,255,.2); }
  .bb-tab.active {
    background: var(--plum-deep);
    color: var(--cream);
    border-color: var(--glass-border);
  }
  .bb-tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .bb-tab-close {
    width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    background: transparent; color: inherit; opacity: .65;
    font-size: 13px; line-height: 1; flex-shrink: 0;
    transition: background .15s var(--ease), opacity .15s var(--ease), transform .15s var(--ease);
  }
  .bb-tab-close:hover { background: rgba(255,255,255,.18); opacity: 1; transform: scale(1.12); }

  .bb-newtab {
    flex-shrink: 0;
    width: 32px; height: 32px;
    margin-bottom: 4px;
    border-radius: 10px;
    display: grid; place-items: center;
    background: var(--glass-light);
    color: var(--cream);
    font-size: 18px;
    transition: background .18s var(--ease), transform .15s var(--ease);
  }
  .bb-newtab:hover { background: var(--cherry); transform: scale(1.08); }
  .bb-newtab:active { transform: scale(.94); }

  /* ---------- Nav bar ---------- */
  .bb-navbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--plum-deep);
    border-bottom: 1px solid var(--glass-border);
  }
  .bb-nav-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: grid; place-items: center;
    background: var(--glass-light);
    color: var(--cream);
    flex-shrink: 0;
    transition: background .18s var(--ease), transform .15s var(--ease);
  }
  .bb-nav-btn:hover:not(:disabled) { background: var(--cherry); transform: translateY(-1px); }
  .bb-nav-btn:active:not(:disabled) { transform: scale(.92); }
  .bb-nav-btn:disabled { opacity: .35; cursor: default; }
  .bb-nav-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

  .bb-addressbar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--glass-light);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 0 14px;
    height: 38px;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .bb-addressbar:focus-within { border-color: var(--cherry); box-shadow: 0 0 0 3px rgba(230,52,98,.18); }
  .bb-addressbar svg { width: 15px; height: 15px; stroke: var(--ink-soft); fill: none; stroke-width: 2; flex-shrink: 0; }
  .bb-addressbar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--cream);
    font: 500 14px var(--font-body);
  }
  .bb-addressbar input::placeholder { color: var(--ink-soft); }

  .bb-close-app {
    flex-shrink: 0;
    padding: 0 14px;
    height: 34px;
    border-radius: 10px;
    background: var(--glass-light);
    color: var(--cream);
    font: 700 13px var(--font-body);
    transition: background .18s var(--ease), transform .15s var(--ease);
  }
  .bb-close-app:hover { background: var(--cherry); }
  .bb-close-app:active { transform: scale(.95); }

  /* ---------- Settings modal ---------- */
  .bb-settings-section { margin-bottom: 18px; }
  .bb-settings-section:last-child { margin-bottom: 0; }
  .bb-settings-section h4 { margin: 0 0 8px; font: 700 13px var(--font-display); color: var(--berry-pink); }
  .bb-engine-opt {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 9px;
    font: 500 13px var(--font-body); color: var(--cream);
    cursor: pointer;
  }
  .bb-engine-opt:hover { background: var(--glass-light); }
  .bb-engine-opt input { accent-color: var(--cherry); }
  .bb-settings-btn {
    width: 100%; text-align: left; padding: 9px 12px; border-radius: 9px;
    background: var(--glass-light); color: var(--cream); font: 600 13px var(--font-body);
    margin-bottom: 8px; transition: background .15s var(--ease);
  }
  .bb-settings-btn:last-child { margin-bottom: 0; }
  .bb-settings-btn:hover { background: var(--cherry); }
  .bb-shortcuts-list { display: flex; flex-direction: column; gap: 6px; }
  .bb-shortcut-row { display: flex; align-items: center; justify-content: space-between; font: 500 12px var(--font-body); color: var(--ink-soft); }
  .bb-kbd {
    background: var(--glass-light); border: 1px solid var(--glass-border);
    border-radius: 6px; padding: 2px 7px; font: 600 11px var(--font-body); color: var(--cream);
  }

  :root { --ease: cubic-bezier(.22,.9,.32,1); }

  /* ---------- Tab context menu ---------- */
  .bb-ctxmenu {
    position: fixed; z-index: 60; min-width: 170px;
    background: var(--plum); border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,.4);
    opacity: 0; transform: scale(.94); transform-origin: top left;
    pointer-events: none; transition: opacity .15s var(--ease), transform .15s var(--ease);
  }
  .bb-ctxmenu.open { opacity: 1; transform: scale(1); pointer-events: auto; }
  .bb-ctx-item {
    padding: 8px 10px; border-radius: 8px; font: 500 13px var(--font-body); color: var(--cream);
    cursor: pointer; transition: background .12s var(--ease);
  }
  .bb-ctx-item:hover { background: var(--glass-light); }
  .bb-tab.dragging { opacity: .4; }
  .bb-tab.bb-tab-entering { opacity: 0; transform: scale(.85) translateY(5px); }
  .bb-tab.bb-tab-enter-active { opacity: 1; transform: scale(1) translateY(0); }
  .bb-tab.bb-tab-closing { opacity: 0 !important; transform: scale(.8); max-width: 0; min-width: 0; padding-left: 0; padding-right: 0; margin: 0; }

  /* content fade when navigating within a tab (start/history/settings/site) */
  .bb-content-enter { opacity: 0; transform: translateY(8px); }
  .bb-content-enter-active { opacity: 1; transform: translateY(0); transition: opacity .24s var(--ease), transform .24s var(--ease); }

  /* ---------- History page ---------- */
  .bb-history {
    height: 100%; overflow-y: auto; padding: 40px 20px 40px;
    display: flex; flex-direction: column; align-items: center;
  }
  .bb-history-head {
    width: 100%; max-width: 640px; display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 22px;
  }
  .bb-history-head h2 { margin: 0; font: 800 26px var(--font-display); color: var(--cream); }
  .bb-history-clear {
    padding: 8px 16px; border-radius: 10px; background: var(--glass-light);
    color: var(--cream); font: 600 12px var(--font-body); transition: background .15s var(--ease);
  }
  .bb-history-clear:hover { background: var(--cherry); }
  .bb-history-list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 4px; }
  .bb-history-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 10px; cursor: pointer; transition: background .13s var(--ease);
  }
  .bb-history-row:hover { background: var(--glass-light); }
  .bb-history-time { font: 600 11px var(--font-body); color: var(--ink-soft); width: 52px; flex-shrink: 0; }
  .bb-history-info { flex: 1; min-width: 0; }
  .bb-history-title { font: 600 13px var(--font-body); color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bb-history-url { font: 500 11px var(--font-body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bb-history-empty { font: 500 13px var(--font-body); color: var(--ink-soft); margin-top: 30px; }

  /* ---------- Settings page ---------- */
  .bb-settings-page {
    height: 100%; overflow-y: auto; padding: 40px 20px 60px;
    display: flex; flex-direction: column; align-items: center;
  }
  .bb-settings-page h2 { margin: 0 0 26px; font: 800 26px var(--font-display); color: var(--cream); width: 100%; max-width: 480px; }
  .bb-settings-page .bb-settings-section { width: 100%; max-width: 480px; }

  /* ---------- Page area ---------- */
  .bb-pages { position: relative; flex: 1; min-height: 0; }
  .bb-page { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .22s var(--ease); }
  .bb-page.active { opacity: 1; pointer-events: auto; }
  .bb-page iframe { width: 100%; height: 100%; border: none; background: #fff; }

  /* ---------- Start page ---------- */
  .bb-start {
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 9vh 20px 40px;
  }
  .bb-logo {
    font: 800 64px var(--font-display);
    color: var(--cherry);
    text-shadow: 0 6px 30px rgba(230,52,98,.45);
    letter-spacing: 1px;
    margin-bottom: 22px;
  }
  .bb-search-form {
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--glass-light);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 4px 6px 4px 18px;
    height: 54px;
  }
  .bb-search-form svg { width: 18px; height: 18px; stroke: var(--berry-pink); fill: none; stroke-width: 2; flex-shrink: 0; }
  .bb-search-form input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--cream); font: 500 16px var(--font-body);
  }
  .bb-search-form input::placeholder { color: var(--ink-soft); }
  .bb-search-go {
    height: 42px; padding: 0 20px; border-radius: 12px;
    background: var(--cherry); color: #fff; font: 700 14px var(--font-body);
    flex-shrink: 0;
    transition: background .18s var(--ease), transform .15s var(--ease);
  }
  .bb-search-go:hover { background: var(--cherry-soft); }
  .bb-search-go:active { transform: scale(.95); }
  .bb-engine-tag {
    margin-top: 10px; font: 500 12px var(--font-body); color: var(--ink-soft);
  }

  .bb-bookmarks {
    width: 100%; max-width: 640px;
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 16px 10px;
  }
  .bb-bm {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; position: relative;
  }
  .bb-bm-icon {
    width: 60px; height: 60px; border-radius: 18px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--cherry) 0%, #ff8fab 55%, #7c3aed 100%);
    color: #fff; font: 800 20px var(--font-display);
    box-shadow: 0 8px 18px rgba(113,26,64,.28);
    border: 1px solid rgba(255,255,255,.5);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    overflow: hidden;
  }
  .bb-bm:hover .bb-bm-icon { transform: translateY(-3px); box-shadow: 0 12px 22px rgba(113,26,64,.36); }
  .bb-bm-icon img { width: 34px; height: 34px; object-fit: contain; border-radius: 7px; background: #fff; padding: 4px; }
  .bb-bm-icon svg { width: 46px; height: 46px; }
  .bb-bm-fallback { width: 100%; height: 100%; display: none; align-items: center; justify-content: center; }
  .bb-bm-label { font: 600 12px var(--font-body); color: var(--cream); text-align: center; }
  .bb-bm-remove {
    position: absolute; top: -6px; right: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--plum); color: var(--cream);
    font-size: 12px; line-height: 1; display: grid; place-items: center;
    border: 1px solid var(--glass-border);
    opacity: 0; transform: scale(.6);
    pointer-events: none;
    transition: opacity .15s var(--ease), transform .15s var(--ease);
  }
  .bb-bm:hover .bb-bm-remove { opacity: 1; transform: scale(1); pointer-events: auto; }

  .bb-bm-add .bb-bm-icon {
    background: var(--glass-light); border: 1.5px dashed var(--glass-border);
    color: var(--berry-pink); font-size: 26px; box-shadow: none;
  }

  /* ---------- Add bookmark modal ---------- */
  .bb-modal-overlay {
    position: fixed; inset: 0; background: rgba(20,8,16,.6);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease);
  }
  .bb-modal-overlay.open { opacity: 1; pointer-events: auto; }
  .bb-modal {
    width: 320px; background: var(--plum); border: 1px solid var(--glass-border);
    border-radius: 18px; padding: 20px;
    transform: scale(.92) translateY(6px);
    transition: transform .22s var(--ease);
  }
  .bb-modal-overlay.open .bb-modal { transform: scale(1) translateY(0); }
  .bb-modal h3 { margin: 0 0 14px; font: 700 16px var(--font-display); color: var(--berry-pink); }
  .bb-modal label { display: block; font: 600 12px var(--font-body); color: var(--ink-soft); margin: 10px 0 5px; }
  .bb-modal input {
    width: 100%; background: var(--glass-light); border: 1px solid var(--glass-border);
    border-radius: 9px; padding: 9px 11px; color: var(--cream); font: 500 13px var(--font-body); outline: none;
  }
  .bb-modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .bb-modal-actions button { flex: 1; height: 36px; border-radius: 10px; font: 700 13px var(--font-body); }
  .bb-modal-cancel { background: var(--glass-light); color: var(--cream); }
  .bb-modal-save { background: var(--cherry); color: #fff; }

  /* ---------- Blocked-site fallback ---------- */
  .bb-blocked {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: 20px; text-align: center;
  }
  .bb-blocked svg { width: 46px; height: 46px; stroke: var(--berry-pink); fill: none; stroke-width: 1.6; }
  .bb-blocked h3 { margin: 0; font: 700 18px var(--font-display); color: var(--cream); }
  .bb-blocked p { margin: 0; max-width: 340px; font: 500 13px var(--font-body); color: var(--ink-soft); line-height: 1.5; }
  .bb-blocked a {
    margin-top: 4px; padding: 10px 22px; border-radius: 12px;
    background: var(--cherry); color: #fff; font: 700 13px var(--font-body); text-decoration: none;
  }
  .bb-blocked a:hover { background: var(--cherry-soft); }

/* Berri AI-style loading screen */
.bb-site-loader {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at center, rgba(232,79,138,.13), transparent 34%),
    #1b0916;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .32s var(--ease), visibility .32s var(--ease);
}
.bb-site-loader.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.bb-loader-content {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 24px;
  border-radius: 18px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 18px 45px rgba(0,0,0,.28);
  backdrop-filter: blur(14px);
}
.bb-loader-orb {
  position: relative;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bb-loader-orb::before,
.bb-loader-orb::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid #e84f8a;
  opacity: 0;
  animation: bbSonarPing 1.8s var(--ease) infinite;
}
.bb-loader-orb::after { animation-delay: .9s; }
.bb-loader-berry {
  width: 27px;
  height: 27px;
  position: relative;
  z-index: 1;
  animation: bbBerryBreathe 1.6s ease-in-out infinite;
  filter: drop-shadow(0 0 7px rgba(232,79,138,.58));
}
.bb-loader-label {
  font-size: 15px;
  font-weight: 600;
  background: linear-gradient(90deg, #8f687b 0%, #ff9fc4 50%, #8f687b 100%);
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  animation: bbShimmerSweep 2s linear infinite;
}
@keyframes bbSonarPing {
  0% { transform: scale(.5); opacity: .62; }
  100% { transform: scale(1.8); opacity: 0; }
}
@keyframes bbBerryBreathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}
@keyframes bbShimmerSweep {
  0% { background-position: 200% center; }
  100% { background-position: -200% center; }
}


/* ---------------- DMs & Calling ---------------- */
.bb-dm-route { position: relative; display: flex; width: 100%; height: 100%; background: var(--plum-deep); color: var(--cream); font-family: var(--font-body); }
.bb-dm-sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; background: var(--plum); }
.bb-dm-me { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--glass-border); }
.bb-dm-me-name { font-weight: 700; font-size: 14px; }
.bb-dm-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--cherry); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; background-size: cover; background-position: center; flex-shrink: 0; }
.bb-dm-avatar.big { width: 72px; height: 72px; font-size: 28px; }
.bb-dm-add-row { display: flex; gap: 6px; padding: 10px 12px; }
.bb-dm-input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; padding: 8px 10px; color: var(--cream); font: 500 13px var(--font-body); outline: none; }
.bb-dm-input:focus { border-color: var(--cherry); }
.bb-dm-newgroup { margin: 0 12px 10px; background: transparent; border: 1px dashed var(--glass-border); color: var(--cherry-soft); border-radius: 8px; padding: 7px; font: 600 12.5px var(--font-body); cursor: pointer; }
.bb-dm-newgroup:hover { border-color: var(--cherry); background: var(--glass); }
.bb-dm-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.bb-dm-section-label { font: 700 11px var(--font-body); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); padding: 10px 8px 4px; }
.bb-dm-empty-hint { color: var(--ink-soft); font-size: 12.5px; padding: 4px 8px; }
.bb-dm-contact { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; }
.bb-dm-contact:hover { background: var(--glass-light); }
.bb-dm-contact.active { background: var(--cherry); }
.bb-dm-contact-name { font: 600 13.5px var(--font-body); }
.bb-dm-contact-sub { font: 500 11.5px var(--font-body); color: var(--berry-pink); display: flex; align-items: center; gap: 5px; }
.bb-dm-dot { width: 7px; height: 7px; border-radius: 50%; background: #666; }
.bb-dm-dot.on { background: #4ade80; }
.bb-dm-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bb-dm-thread-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--glass-border); }
.bb-dm-thread-title { display: flex; align-items: center; gap: 10px; }
.bb-dm-thread-empty { color: var(--ink-soft); font-size: 13px; }
.bb-dm-call-btns { display: flex; gap: 8px; }
.bb-dm-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bb-dm-msg { max-width: 60%; align-self: flex-start; }
.bb-dm-msg.mine { align-self: flex-end; text-align: right; }
.bb-dm-msg-author { font: 700 10.5px var(--font-body); color: var(--berry-pink); margin-bottom: 2px; }
.bb-dm-msg-bubble { background: var(--glass-light); border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px 12px; font: 500 13.5px var(--font-body); }
.bb-dm-msg.mine .bb-dm-msg-bubble { background: var(--cherry); border-color: transparent; }
.bb-dm-compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--glass-border); }

.bb-dm-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 60; }
.bb-dm-modal-overlay.open { display: flex; }
.bb-dm-modal { background: var(--plum); border: 1px solid var(--glass-border); border-radius: 16px; padding: 22px; width: 320px; color: var(--cream); }
.bb-dm-modal h3 { margin: 0 0 6px; font-family: var(--font-display); }
.bb-dm-hint { color: var(--ink-soft); font-size: 12.5px; margin: 0 0 12px; }
.bb-dm-modal .bb-dm-input { width: 100%; margin-bottom: 10px; }
.bb-dm-avatar-pick { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 14px; font-size: 12.5px; color: var(--berry-pink); }
.bb-dm-avatar-preview { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-light); border: 1px dashed var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 20px; background-size: cover; background-position: center; }
.bb-dm-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.bb-dm-group-members { max-height: 160px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.bb-dm-group-member-row { font-size: 13px; display: flex; gap: 8px; align-items: center; }

.bb-dm-call-overlay { position: absolute; inset: 0; background: rgba(10,3,7,.92); display: none; align-items: center; justify-content: center; z-index: 40; }
.bb-dm-call-overlay.open { display: flex; }
.bb-dm-incoming { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bb-dm-incoming-text { font: 700 18px var(--font-display); }
.bb-dm-incoming-sub { color: var(--berry-pink); font-size: 13px; margin-bottom: 10px; }
.bb-dm-incoming-actions { display: flex; gap: 14px; margin-top: 6px; }
.bb-dm-accept-btn, .bb-dm-decline-btn { border: none; border-radius: 999px; padding: 10px 22px; font: 700 13px var(--font-body); cursor: pointer; }
.bb-dm-accept-btn { background: #4ade80; color: #05230f; }
.bb-dm-decline-btn { background: #ef4444; color: #fff; }
.bb-dm-call { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; }
.bb-dm-call-status { font: 600 14px var(--font-body); color: var(--berry-pink); }
.bb-dm-call-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; width: 100%; max-width: 820px; }
.bb-dm-call-tile { position: relative; background: var(--plum); border-radius: 14px; overflow: hidden; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border); }
.bb-dm-call-tile video { width: 100%; height: 100%; object-fit: cover; }
.bb-dm-call-label { position: absolute; bottom: 6px; left: 8px; background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 999px; font: 600 11px var(--font-body); z-index: 2; }
.call-avatar { width: 64px; height: 64px; font-size: 24px; }
.bb-dm-call-controls { display: flex; gap: 12px; }
.bb-dm-call-ctrl { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--glass-light); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.bb-dm-call-ctrl:hover { background: var(--cherry); }
.bb-dm-call-ctrl.off { background: #ef4444; }
.bb-dm-call-end { background: #ef4444; }
.bb-dm-call-end:hover { background: #dc2626; }
</style>
</head>
<body>

  <div class="bb-tabstrip" id="bbTabstrip"></div>

  <div class="bb-navbar">
    <button class="bb-nav-btn" id="bbBack" title="Back (Alt+←)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>

    <button class="bb-nav-btn" id="bbHome" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <button class="bb-nav-btn" id="bbHistoryBtn" title="History (Ctrl+Shift+H)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 8v4l3 2"/></svg></button>

      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
    </button>

    <button class="bb-close-app" id="bbCloseApp">Close</button>
  </div>

  <div class="bb-pages" id="bbPages"></div>
</div>

<div class="bb-ctxmenu" id="bbCtxMenu"></div>

<div class="bb-modal-overlay" id="bbAddBmOverlay">
  <div class="bb-modal">
    <h3>Add bookmark</h3>
    <label>Name</label>
    <input id="bbBmName" type="text" placeholder="My Site"/>
    <label>URL</label>
    <input id="bbBmUrl" type="text" placeholder="example.com"/>
    <div class="bb-modal-actions">
      <button class="bb-modal-cancel" id="bbBmCancel">Cancel</button>
      <button class="bb-modal-save" id="bbBmSave">Save</button>
    </div>
  </div>
</div>
